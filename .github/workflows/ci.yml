name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode verify
        working-directory: backend
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx --yes --package ajv-cli@5 --package ajv-formats ajv compile --spec=draft2020 -c ajv-formats -s "shared/schemas/**/*.json"
      - run: npx --yes --package ajv-cli@5 --package ajv-formats ajv validate --spec=draft2020 -c ajv-formats -s shared/schemas/lesson/lesson-draft-v1.schema.json -r shared/schemas/blocks/block-v1.schema.json -d "shared/fixtures/lesson/*draft.json"
      - run: npx --yes --package ajv-cli@5 --package ajv-formats ajv validate --spec=draft2020 -c ajv-formats -s shared/schemas/lesson/lesson-version-v1.schema.json -r shared/schemas/blocks/block-v1.schema.json -d shared/fixtures/lesson/published-version.json
      - run: if npx --yes --package ajv-cli@5 --package ajv-formats ajv validate --spec=draft2020 -c ajv-formats -s shared/schemas/blocks/block-v1.schema.json -d shared/fixtures/lesson/invalid-block-configuration.json; then exit 1; fi
      - run: npx --yes @redocly/cli@latest lint shared/openapi/openapi.yaml
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4