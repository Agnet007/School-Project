spring:
  application:
    name: school-platform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/school}
    username: ${DATABASE_USER:school}
    password: ${DATABASE_PASSWORD:school}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
server:
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 2MB
spring.servlet.multipart.max-file-size: 5MB
spring.servlet.multipart.max-request-size: 6MB